<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pengeluaran Bulanan</title>
<meta name="theme-color" content="#0f6b57">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2ef;--card:#fbfcfb;--ink:#16302a;--mute:#5d726b;--line:#d3ddd8;--acc:#0f6b57;--acc-ink:#fff;--warn:#b3402a}
@media (prefers-color-scheme:dark){:root{--bg:#10201c;--card:#172a25;--ink:#e6f0ec;--mute:#93aaa2;--line:#2b443d;--acc:#4fc4a6;--acc-ink:#0b1d18;--warn:#f08a74}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:1.6rem;font-weight:800;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between;margin-bottom:16px}
.sync{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin:0 0 20px}
.sync .sub{margin:0;font-size:.9rem}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);width:calc(100% - 32px);max-width:420px;padding:16px}
dialog::backdrop{background:rgba(0,0,0,.5)}
dialog form{border:0;padding:0;margin:0;background:none}
.bulan-nama{font-size:1.3rem;font-weight:600;text-transform:capitalize}
.ringkas{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:16px}
.ringkas>div{padding:14px;background:var(--card);border:1px solid var(--line);border-radius:10px}
.ringkas label{margin:0 0 4px}
.ringkas .angka{font-size:1.5rem;font-weight:800;line-height:1.3;font-variant-numeric:tabular-nums}
.ringkas .angka.minus{color:var(--warn)}
.ringkas .ket{font-size:.8rem;color:var(--mute);margin-top:2px}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:4px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:20px}
form .wide{grid-column:1/-1}
@media(min-width:640px){form .wide{grid-column:span 2}}
button{cursor:pointer;border:0;border-radius:6px;padding:10px 14px;font-weight:600}
.primary{background:var(--acc);color:var(--acc-ink);align-self:end}
.ghost{background:transparent;border:1px solid var(--line)}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{padding:6px 12px;border:1px solid var(--line);border-radius:99px;font-size:.85rem;font-weight:400;background:var(--card)}
.chip b{font-weight:600}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.info{font-size:.9rem;color:var(--mute);margin:-6px 0 12px}
.info:empty{display:none}
.scroll{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:.85rem;color:var(--mute);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td button{padding:4px 8px;background:none;color:var(--warn)}
.empty{padding:28px;text-align:center;color:var(--mute)}
.foot{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<main>
  <h1>Pengeluaran bulanan</h1>
  <div class="sync"><span class="sub" id="status"></span><button class="ghost" id="setelan" type="button">Atur sinkron</button></div>

  <div class="bar">
    <div class="bulan-nama" id="bulanLabel"></div>
    <div><label for="bulan">Bulan</label><input type="month" id="bulan"></div>
  </div>

  <div class="ringkas">
    <div>
      <label for="masuk">Pendapatan (Rp)</label>
      <input type="number" id="masuk" min="0" step="any" inputmode="numeric" placeholder="Isi manual">
    </div>
    <div>
      <label>Pengeluaran</label>
      <div class="angka" id="total">Rp0</div>
    </div>
    <div>
      <label>Sisa</label>
      <div class="angka" id="sisa">Rp0</div>
      <div class="ket" id="persen"></div>
    </div>
  </div>

  <form id="form">
    <div><label for="tgl">Tanggal</label><input type="date" id="tgl" required></div>
    <div><label for="kat">Kategori</label>
      <select id="kat">
        <option>Makan</option><option>Transportasi</option><option>Tagihan</option>
        <option>Belanja</option><option>Hiburan</option><option>Kesehatan</option><option>Lainnya</option>
      </select></div>
    <div class="wide"><label for="ket">Keterangan</label><input id="ket" placeholder="Contoh: makan siang" required></div>
    <div><label for="jml">Jumlah (Rp)</label><input type="number" id="jml" min="0" step="any" inputmode="numeric" required></div>
    <button class="primary" type="submit">Tambah</button>
  </form>

  <div class="cats" id="cats"></div>
  <div class="info" id="info"></div>

  <div class="scroll">
    <table>
      <thead><tr><th>Tanggal</th><th>Kategori</th><th>Keterangan</th><th class="num">Jumlah</th><th></th></tr></thead>
      <tbody id="isi"></tbody>
    </table>
  </div>

  <div class="foot">
    <button class="ghost" id="csv">Unduh CSV</button>
    <button class="ghost" id="hapus">Hapus semua data bulan ini</button>
  </div>
</main>

<dialog id="dlg">
  <form id="fsync" method="dialog">
    <div class="wide"><label for="surl">URL Apps Script (berakhir /exec)</label><input id="surl" type="url" required placeholder="https://script.google.com/macros/s/.../exec"></div>
    <div class="wide"><label for="spin">PIN</label><input id="spin" type="password" autocomplete="off" required></div>
    <div class="wide" style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="primary" value="simpan">Simpan &amp; sambungkan</button>
      <button class="ghost" type="button" id="putus">Putuskan</button>
      <button class="ghost" value="batal" formnovalidate>Tutup</button>
    </div>
  </form>
</dialog>

<script>
const KEY = 'pengeluaran-v1';
const rp = n => new Intl.NumberFormat('id-ID', {style:'currency', currency:'IDR', maximumFractionDigits:0}).format(n);
const $ = id => document.getElementById(id);
let data = [];
try { data = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { data = []; }
const simpan = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); localStorage.setItem(KEY2, JSON.stringify(pemasukan)); localStorage.setItem(KEYQ, JSON.stringify(antrian)); } catch (e) {} };

const KEY2 = 'pendapatan-v1';
let pemasukan = {};
try { pemasukan = JSON.parse(localStorage.getItem(KEY2)) || {}; } catch (e) { pemasukan = {}; }

const KEYQ = 'antrian-v1', KEYC = 'sync-cfg-v1';
const baca = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } };
let antrian = baca(KEYQ, []), cfg = baca(KEYC, {});
const simpanCfg = () => { try { localStorage.setItem(KEYC, JSON.stringify(cfg)); } catch (e) {} };
const setStatus = t => { $('status').textContent = t; };
const statusDasar = () => setStatus(!cfg.url ? 'Belum tersambung: data hanya ada di perangkat ini.'
  : antrian.length ? 'Menunggu koneksi: ' + antrian.length + ' perubahan belum terkirim.' : 'Tersinkron.');

// Terapkan perubahan ke data lokal (sama persis dengan aturan di Code.gs)
const terapkan = op => {
  if (op.t === 'add') { if (!data.some(d => d.id === op.e.id)) data.push(op.e); }
  else if (op.t === 'del') data = data.filter(d => d.id !== op.id);
  else if (op.t === 'delbulan') data = data.filter(d => !d.tgl.startsWith(op.bulan));
  else if (op.t === 'inc') { if (op.jml > 0) pemasukan[op.bulan] = op.jml; else delete pemasukan[op.bulan]; }
  else if (op.t === 'incbila') { if (pemasukan[op.bulan] === undefined && op.jml > 0) pemasukan[op.bulan] = op.jml; }
};
// Setiap perubahan: tampil langsung, masuk antrian, lalu coba kirim (kalau offline, menunggu)
const antri = op => { terapkan(op); antrian.push(op); simpan(); tampil(); sinkron(); };

let sibuk = false, ulang = false;
async function sinkron() {
  if (!cfg.url || !cfg.pin) return statusDasar();
  if (sibuk) { ulang = true; return; }
  sibuk = true;
  setStatus('Menyinkronkan…');
  const kirim = antrian.slice();
  try {
    const r = await fetch(cfg.url, {method: 'POST', headers: {'Content-Type': 'text/plain;charset=utf-8'}, body: JSON.stringify({pin: cfg.pin, ops: kirim})});
    const j = await r.json();
    if (!j.ok) {
      setStatus(j.error === 'pin' ? 'PIN salah. Cek di Atur sinkron.' : 'Server menolak: ' + j.error);
    } else {
      antrian = antrian.slice(kirim.length);
      data = j.data; pemasukan = j.pemasukan;
      antrian.forEach(terapkan); // perubahan yang dibuat saat proses kirim berlangsung
      simpan(); tampil();
      setStatus('Tersinkron ' + new Date().toLocaleTimeString('id-ID', {hour: '2-digit', minute: '2-digit'}) + (antrian.length ? ' (' + antrian.length + ' menunggu)' : ''));
    }
  } catch (e) {
    setStatus(e instanceof SyntaxError ? 'Balasan tidak valid. Cek URL Apps Script.'
      : 'Offline: ' + (antrian.length ? antrian.length + ' perubahan menunggu dikirim.' : 'menampilkan data terakhir.'));
  }
  sibuk = false;
  if (ulang) { ulang = false; sinkron(); }
}

const hariIni = new Date();
const pad = n => String(n).padStart(2, '0');
$('bulan').value = hariIni.getFullYear() + '-' + pad(hariIni.getMonth() + 1);
$('tgl').value = $('bulan').value + '-' + pad(hariIni.getDate());

const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let filterKat = '';
const ringkasan = () => {
  const b = $('bulan').value;
  const masuk = pemasukan[b] || 0;
  const keluar = data.filter(d => d.tgl.startsWith(b)).reduce((s, d) => s + d.jml, 0);
  const sisa = masuk - keluar;
  $('total').textContent = rp(keluar);
  $('sisa').textContent = rp(sisa);
  $('sisa').classList.toggle('minus', sisa < 0);
  $('persen').textContent = masuk > 0
    ? Math.round(keluar / masuk * 100) + '% dari pendapatan terpakai'
    : 'Isi pendapatan untuk melihat sisa';
};
const tampil = () => {
  const b = $('bulan').value;
  const rows = data.filter(d => d.tgl.startsWith(b)).sort((a, z) => a.tgl.localeCompare(z.tgl));
  const [th, bl] = b.split('-');
  $('bulanLabel').textContent = new Date(th, bl - 1).toLocaleDateString('id-ID', {month:'long', year:'numeric'});
  if (document.activeElement !== $('masuk')) $('masuk').value = pemasukan[b] || '';
  ringkasan();

  const per = {};
  rows.forEach(d => per[d.kat] = (per[d.kat] || 0) + d.jml);
  if (filterKat && !per[filterKat]) filterKat = '';
  const chip = (k, t, aktif) => `<button type="button" class="chip${aktif ? ' on' : ''}" data-kat="${esc(k)}" aria-pressed="${aktif}">${t}</button>`;
  $('cats').innerHTML = chip('', 'Semua', !filterKat) + Object.entries(per).sort((a, z) => z[1] - a[1])
    .map(([k, v]) => chip(k, `${esc(k)}: <b>${rp(v)}</b>`, k === filterKat)).join('');
  const tampilRows = filterKat ? rows.filter(d => d.kat === filterKat) : rows;
  $('info').textContent = filterKat ? `${filterKat}: ${tampilRows.length} catatan, total ${rp(per[filterKat])}` : '';

  $('isi').innerHTML = tampilRows.length ? tampilRows.map(d => `<tr>
    <td>${new Date(d.tgl).toLocaleDateString('id-ID', {day:'numeric', month:'short'})}</td>
    <td>${esc(d.kat)}</td><td>${esc(d.ket)}</td>
    <td class="num">${rp(d.jml)}</td>
    <td><button data-id="${d.id}" aria-label="Hapus ${esc(d.ket)}">Hapus</button></td></tr>`).join('')
    : '<tr><td colspan="5" class="empty">Belum ada pengeluaran bulan ini. Isi form di atas untuk menambah.</td></tr>';
};

$('form').addEventListener('submit', e => {
  e.preventDefault();
  const baru = {id: Date.now(), tgl: $('tgl').value, kat: $('kat').value, ket: $('ket').value.trim(), jml: Number($('jml').value)};
  $('bulan').value = $('tgl').value.slice(0, 7);
  $('ket').value = ''; $('jml').value = ''; $('ket').focus();
  antri({t: 'add', e: baru});
});
$('isi').addEventListener('click', e => {
  const id = e.target.dataset.id;
  if (!id) return;
  antri({t: 'del', id: Number(id)});
});
$('bulan').addEventListener('change', tampil);
$('cats').addEventListener('click', e => {
  const b = e.target.closest('.chip');
  if (!b) return;
  filterKat = b.dataset.kat === filterKat ? '' : b.dataset.kat;
  tampil();
});
$('masuk').addEventListener('input', () => {
  pemasukan[$('bulan').value] = Math.max(0, Number($('masuk').value) || 0);
  simpan(); ringkasan();
});
$('masuk').addEventListener('change', () => {
  antri({t: 'inc', bulan: $('bulan').value, jml: Math.max(0, Number($('masuk').value) || 0)});
});
$('hapus').addEventListener('click', () => {
  if (!confirm('Hapus semua pengeluaran di bulan ini?')) return;
  antri({t: 'delbulan', bulan: $('bulan').value});
});
$('csv').addEventListener('click', () => {
  const b = $('bulan').value;
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const rows = data.filter(d => d.tgl.startsWith(b)).sort((a, z) => a.tgl.localeCompare(z.tgl));
  const masuk = pemasukan[b] || 0;
  const keluar = rows.reduce((s, d) => s + d.jml, 0);
  const baris = ['Tanggal,Kategori,Keterangan,Jumlah']
    .concat(rows.map(d => [d.tgl, q(d.kat), q(d.ket), d.jml].join(',')))
    .concat(['', 'Pendapatan,,,' + masuk, 'Total pengeluaran,,,' + keluar, 'Sisa,,,' + (masuk - keluar)]);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([baris.join('\n')], {type:'text/csv'}));
  a.download = 'pengeluaran-' + b + '.csv';
  a.click();
});
tampil();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

$('setelan').addEventListener('click', () => {
  $('surl').value = cfg.url || ''; $('spin').value = cfg.pin || '';
  $('dlg').showModal();
});
$('fsync').addEventListener('submit', e => {
  if (!e.submitter || e.submitter.value !== 'simpan') return;
  cfg = {url: $('surl').value.trim(), pin: $('spin').value};
  simpanCfg();
  // Kirim data yang sudah ada di HP ini (aman diulang: data yang sama tidak akan dobel)
  data.forEach(d => antrian.push({t: 'add', e: d}));
  Object.keys(pemasukan).forEach(b => antrian.push({t: 'incbila', bulan: b, jml: pemasukan[b]}));
  simpan(); sinkron();
});
$('putus').addEventListener('click', () => {
  cfg = {}; simpanCfg(); $('dlg').close(); statusDasar();
});
addEventListener('online', sinkron);
document.addEventListener('visibilitychange', () => { if (!document.hidden) sinkron(); });
setInterval(() => { if (!document.hidden) sinkron(); }, 30000);
statusDasar(); sinkron();
</script>
</body>
</html>
