<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pengeluaran Bulanan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2ef;--card:#fbfcfb;--ink:#16302a;--mute:#5d726b;--line:#d3ddd8;--acc:#0f6b57;--acc-ink:#fff;--warn:#b3402a}
@media (prefers-color-scheme:dark){:root{--bg:#10201c;--card:#172a25;--ink:#e6f0ec;--mute:#93aaa2;--line:#2b443d;--acc:#4fc4a6;--acc-ink:#0b1d18;--warn:#f08a74}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:1.6rem;font-weight:800;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 20px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between;margin-bottom:16px}
.total{font-size:2.2rem;font-weight:800;line-height:1}
.total small{display:block;font-size:.85rem;font-weight:400;color:var(--mute);margin-bottom:4px}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:4px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:20px}
form .wide{grid-column:1/-1}
@media(min-width:640px){form .wide{grid-column:span 2}}
button{cursor:pointer;border:0;border-radius:6px;padding:10px 14px;font-weight:600}
.primary{background:var(--acc);color:var(--acc-ink);align-self:end}
.ghost{background:transparent;border:1px solid var(--line)}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.cats span{padding:4px 10px;border:1px solid var(--line);border-radius:99px;font-size:.85rem;background:var(--card)}
.cats b{font-weight:600}
.scroll{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:.85rem;color:var(--mute);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td button{padding:4px 8px;background:none;color:var(--warn)}
.empty{padding:28px;text-align:center;color:var(--mute)}
.foot{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<main>
  <h1>Pengeluaran bulanan</h1>
  <p class="sub">Data tersimpan di browser kamu sendiri. Tidak dikirim ke mana pun.</p>

  <div class="bar">
    <div class="total"><small id="bulanLabel"></small><span id="total">Rp0</span></div>
    <div><label for="bulan">Bulan</label><input type="month" id="bulan"></div>
  </div>

  <form id="form">
    <div><label for="tgl">Tanggal</label><input type="date" id="tgl" required></div>
    <div><label for="kat">Kategori</label>
      <select id="kat">
        <option>Makan</option><option>Transportasi</option><option>Tagihan</option>
        <option>Belanja</option><option>Hiburan</option><option>Kesehatan</option><option>Lainnya</option>
      </select></div>
    <div class="wide"><label for="ket">Keterangan</label><input id="ket" placeholder="Contoh: makan siang" required></div>
    <div><label for="jml">Jumlah (Rp)</label><input type="number" id="jml" min="0" step="any" inputmode="numeric" required></div>
    <button class="primary" type="submit">Tambah</button>
  </form>

  <div class="cats" id="cats"></div>

  <div class="scroll">
    <table>
      <thead><tr><th>Tanggal</th><th>Kategori</th><th>Keterangan</th><th class="num">Jumlah</th><th></th></tr></thead>
      <tbody id="isi"></tbody>
    </table>
  </div>

  <div class="foot">
    <button class="ghost" id="csv">Unduh CSV</button>
    <button class="ghost" id="hapus">Hapus semua data bulan ini</button>
  </div>
</main>

<script>
const KEY = 'pengeluaran-v1';
const rp = n => new Intl.NumberFormat('id-ID', {style:'currency', currency:'IDR', maximumFractionDigits:0}).format(n);
const $ = id => document.getElementById(id);
let data = [];
try { data = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { data = []; }
const simpan = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) {} };

const hariIni = new Date();
const pad = n => String(n).padStart(2, '0');
$('bulan').value = hariIni.getFullYear() + '-' + pad(hariIni.getMonth() + 1);
$('tgl').value = $('bulan').value + '-' + pad(hariIni.getDate());

const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tampil = () => {
  const b = $('bulan').value;
  const rows = data.filter(d => d.tgl.startsWith(b)).sort((a, z) => a.tgl.localeCompare(z.tgl));
  const [th, bl] = b.split('-');
  $('bulanLabel').textContent = 'Total ' + new Date(th, bl - 1).toLocaleDateString('id-ID', {month:'long', year:'numeric'});
  $('total').textContent = rp(rows.reduce((s, d) => s + d.jml, 0));

  const per = {};
  rows.forEach(d => per[d.kat] = (per[d.kat] || 0) + d.jml);
  $('cats').innerHTML = Object.entries(per).sort((a, z) => z[1] - a[1])
    .map(([k, v]) => `<span>${esc(k)}: <b>${rp(v)}</b></span>`).join('');

  $('isi').innerHTML = rows.length ? rows.map(d => `<tr>
    <td>${new Date(d.tgl).toLocaleDateString('id-ID', {day:'numeric', month:'short'})}</td>
    <td>${esc(d.kat)}</td><td>${esc(d.ket)}</td>
    <td class="num">${rp(d.jml)}</td>
    <td><button data-id="${d.id}" aria-label="Hapus ${esc(d.ket)}">Hapus</button></td></tr>`).join('')
    : '<tr><td colspan="5" class="empty">Belum ada pengeluaran bulan ini. Isi form di atas untuk menambah.</td></tr>';
};

$('form').addEventListener('submit', e => {
  e.preventDefault();
  data.push({id: Date.now(), tgl: $('tgl').value, kat: $('kat').value, ket: $('ket').value.trim(), jml: Number($('jml').value)});
  simpan();
  $('bulan').value = $('tgl').value.slice(0, 7);
  $('ket').value = ''; $('jml').value = ''; $('ket').focus();
  tampil();
});
$('isi').addEventListener('click', e => {
  const id = e.target.dataset.id;
  if (!id) return;
  data = data.filter(d => String(d.id) !== id);
  simpan(); tampil();
});
$('bulan').addEventListener('change', tampil);
$('hapus').addEventListener('click', () => {
  if (!confirm('Hapus semua pengeluaran di bulan ini?')) return;
  data = data.filter(d => !d.tgl.startsWith($('bulan').value));
  simpan(); tampil();
});
$('csv').addEventListener('click', () => {
  const b = $('bulan').value;
  const q = s => '"' + String(s).replace(/"/g, '""') + '"';
  const baris = ['Tanggal,Kategori,Keterangan,Jumlah'].concat(
    data.filter(d => d.tgl.startsWith(b)).map(d => [d.tgl, q(d.kat), q(d.ket), d.jml].join(',')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([baris.join('\n')], {type:'text/csv'}));
  a.download = 'pengeluaran-' + b + '.csv';
  a.click();
});
tampil();
</script>
</body>
</html>
